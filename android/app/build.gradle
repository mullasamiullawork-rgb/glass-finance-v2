apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace = "com.samiulla.glassfinance"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.samiulla.glassfinance"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(System.getenv("GF_VERSION_CODE") ?: "1")
        versionName = (System.getenv("GF_VERSION_NAME") ?: "2.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro' }
    }
}
kotlin { jvmToolchain(21) }
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    implementation "androidx.room:room-runtime:2.7.0"
    implementation "androidx.room:room-ktx:2.7.0"
    ksp "androidx.room:room-compiler:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
}
apply from: 'capacitor.build.gradle'
