name: Android build (debug APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build Debug APK
        working-directory: android
        env:
          GF_VERSION_CODE: ${{ github.run_number }}
          GF_VERSION_NAME: 2.0.${{ github.run_number }}-debug
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk && ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glass-finance-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish debug-latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Glass Finance v2 (latest debug build)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
