<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <title>Glass Finance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <button id="fab" class="fab" aria-label="Quick Add Transaction" title="Quick Add">+</button>
  <nav id="tabbar" class="tabbar glass-bar" aria-label="Primary navigation">

    <a href="#/budget" data-tab="budget" class="tab"><span>🎯</span><small>Budget</small></a>
    <a href="#/analytics" data-tab="analytics" class="tab"><span>📊</span><small>Analytics</small></a>
    <a href="#/more" data-tab="more" class="tab"><span>•••</span><small>More</small></a>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="src/core.js"></script>
  <script src="src/native.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/app.js"></script>

</html>
